name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk MetroLauncher.apk

      - name: Save APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: MetroLauncher-apk
          path: MetroLauncher.apk

      - name: Publish APK as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Metro Launcher build ${{ github.run_number }}
          files: MetroLauncher.apk
