plugins {
    id 'com.android.application'
}

android {
    namespace 'com.metro.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.metro.launcher'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    // A fixed signing key, so each new build installs as an update over the last one
    // (the cloud build machine would otherwise sign with a new random key every time).
    signingConfigs {
        debug {
            storeFile file('metro-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No third-party libraries: plain Android framework only.
dependencies {
}
